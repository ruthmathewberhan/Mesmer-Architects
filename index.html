    body {
      font-family: 'Inter', sans-serif;

    h2,

    h4,

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {

            background: #000;

        ::-webkit-scrollbar-thumb {

        }
  </style>
